<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKM DÉLIVRANCE — Back-office</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--b:#6f1020;--g:#d6a62d;--line:#ead9c2}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f7efe5;color:#26191b}.wrap{max-width:1050px;margin:auto;padding:20px}.top{background:linear-gradient(135deg,#4c0713,#8a162c);color:#fff;padding:20px;border-radius:18px}.top h1{margin:0;color:#f2d16b;font-family:Georgia,serif}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.btn{border:0;border-radius:12px;padding:12px 14px;background:#d6a62d;font-weight:800}.btn.secondary{background:#fff;border:2px solid var(--b);color:var(--b)}input,select,textarea{width:100%;padding:11px;border:1px solid #d8c9bb;border-radius:10px;font:inherit}.muted{color:#74656a}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#f4e5cb;font-size:12px;font-weight:800}.dossier{cursor:pointer}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eee;padding:7px 0}.answers{max-height:420px;overflow:auto}.hidden{display:none}.danger{background:#fff3d2;border:1px solid #d7b46a;padding:12px;border-radius:12px}</style></head><body><div class="wrap"><div class="top"><h1>SKM DÉLIVRANCE</h1><p>Back-office confidentiel — Révérend Serge Kassi</p></div>
<div id="login" class="card"><h2>Connexion administrateur</h2><p class="muted">L’accès aux fiches est protégé par Supabase Auth et les règles RLS.</p><input id="adminEmail" type="email" placeholder="Votre e-mail administrateur"><button class="btn" onclick="sendMagicLink()">Recevoir mon lien de connexion</button><div id="loginState"></div></div>
<div id="panel" class="hidden"><div class="card"><button class="btn secondary" onclick="logout()">Déconnexion</button><button class="btn" onclick="loadDossiers()">Actualiser les dossiers</button></div><div id="stats" class="grid"></div><div id="list"></div><div id="detail"></div></div></div>
<script>
const cfg=window.SKM_CONFIG||{};const db=(cfg.SUPABASE_URL&&cfg.SUPABASE_URL.indexOf('PASTE_')!==0)?supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null;let dossierCache=[];
async function sendMagicLink(){if(!db){loginState.innerHTML='<p class="danger">Supabase n’est pas encore configuré dans config.js.</p>';return}const email=adminEmail.value.trim();if(!email)return;const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});loginState.innerHTML=error?'<p class="danger">'+esc(error.message)+'</p>':'<p>Un lien de connexion a été envoyé à votre adresse.</p>'}
async function boot(){if(!db)return;const {data}=await db.auth.getSession();if(data.session){login.classList.add('hidden');panel.classList.remove('hidden');loadDossiers()}}
async function logout(){await db.auth.signOut();location.reload()}
async function loadDossiers(){detail.innerHTML='';const {data,error}=await db.from('dossiers').select('*,appointments(*)').order('created_at',{ascending:false});if(error){list.innerHTML='<div class="card danger">Accès refusé ou erreur : '+esc(error.message)+'</div>';return}stats.innerHTML=`<div class="card"><b>${data.length}</b><br><span class="muted">Dossiers</span></div><div class="card"><b>${data.filter(x=>x.appointment_requested).length}</b><br><span class="muted">Demandes de rendez-vous</span></div><div class="card"><b>${data.filter(x=>x.status==='Nouveau').length}</b><br><span class="muted">Nouveaux</span></div>`;dossierCache=data;list.innerHTML='<h2>Dossiers</h2>'+data.map((d,i)=>`<div class="card dossier" data-index="${i}"><div class="row"><b>${esc(d.full_name)}</b><span class="pill">${esc(d.status)}</span></div><div class="row"><span>${new Date(d.created_at).toLocaleString('fr-FR')}</span><span>${d.pathway_completed}/7 étapes</span></div><p>${esc(d.summary||'')}</p>${d.appointment_requested?'<span class="pill">Rendez-vous demandé</span>':''}</div>`).join('');document.querySelectorAll('.dossier').forEach(el=>el.onclick=()=>openDossier(Number(el.dataset.index)))}
function openDossier(i){const d=dossierCache[i];const ans=Object.entries(d.answers||{}).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');const cats=Object.entries(d.categories||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${v}</b></div>`).join('');const ap=(d.appointments||[])[0];detail.innerHTML=`<div class="card"><h2>${esc(d.full_name)}</h2><div class="grid"><div><div class="row"><span>Téléphone</span><b>${esc(d.phone||'—')}</b></div><div class="row"><span>E-mail</span><b>${esc(d.email||'—')}</b></div><div class="row"><span>Ville</span><b>${esc(d.city||'—')}</b></div><div class="row"><span>Âge</span><b>${esc(d.age_range||'—')}</b></div><div class="row"><span>Église</span><b>${esc(d.church||'—')}</b></div></div><div><h3>Récapitulatif pastoral</h3><p>${esc(d.summary||'')}</p><p><b>Livre / ressource :</b> ${esc(d.recommended_book||'—')}</p><p><b>E-learning :</b> ${d.pathway_completed}/7</p></div></div><h3>Axes</h3>${cats}<h3>Réponses</h3><div class="answers">${ans}</div><h3>Rendez-vous</h3>${ap?`<div class="row"><span>Date</span><b>${esc(ap.preferred_date||'—')}</b></div><div class="row"><span>Créneau</span><b>${esc(ap.preferred_time||'—')}</b></div><div class="row"><span>Modalité</span><b>${esc(ap.modality||'—')}</b></div><p>${esc(ap.message||'')}</p>`:'<p>Aucune demande.</p>'}<h3>Suivi du dossier</h3><select id="statusSel"><option>Nouveau</option><option>À contacter</option><option>Rendez-vous fixé</option><option>En accompagnement</option><option>Suivi terminé</option></select><textarea id="privateNotes" placeholder="Notes pastorales privées"></textarea><button class="btn" onclick="saveDossier('${d.id}')">Enregistrer</button><div id="saveState"></div></div>`;statusSel.value=d.status||'Nouveau';privateNotes.value=d.private_notes||'';detail.scrollIntoView({behavior:'smooth'})}
async function saveDossier(id){const {error}=await db.from('dossiers').update({status:statusSel.value,private_notes:privateNotes.value}).eq('id',id);saveState.textContent=error?error.message:'Enregistré.';if(!error)loadDossiers()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
boot();db&&db.auth.onAuthStateChange(()=>boot());
</script></body></html>
